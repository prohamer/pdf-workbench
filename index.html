<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 工作台</title>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<style>
  :root{
    --bg:#e6e8ee;--panel:#ffffff;--ink:#1a1f28;--muted:#6b7280;--faint:#9aa1ac;
    --line:#d9dde4;--line-strong:#c3c8d1;--accent:#4338ca;--accent-ink:#3730a3;
    --accent-soft:#eef0ff;--danger:#c53a45;--danger-soft:#fdeced;--paper:#ffffff;
    --shadow:0 1px 2px rgba(20,25,35,.06),0 8px 24px rgba(20,25,35,.10);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    --radius:9px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);
    display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;}

  .topbar{flex:none;display:flex;align-items:center;gap:18px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5;}
  .brand{display:flex;flex-direction:column;line-height:1.05;padding-right:6px;border-right:1px solid var(--line);margin-right:2px}
  .brand .name{font-weight:700;font-size:15px;letter-spacing:-.01em}
  .brand .name b{color:var(--accent)}
  .brand .tag{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.02em;margin-top:2px}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .spacer{flex:1}

  button{font-family:var(--sans);cursor:pointer}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:#fff;color:var(--ink);
    padding:8px 12px;border-radius:8px;font-size:13px;font-weight:550;transition:background .12s,border-color .12s,box-shadow .12s,color .12s;white-space:nowrap;}
  .btn svg{width:15px;height:15px;flex:none}
  .btn:hover:not(:disabled){background:#f6f7fa;border-color:var(--faint)}
  .btn:active:not(:disabled){background:#eef0f4}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--accent-ink);border-color:var(--accent-ink)}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover:not(:disabled){background:#f0f1f5}
  .btn.danger{color:var(--danger);border-color:transparent;background:transparent}
  .btn.danger:hover:not(:disabled){background:var(--danger-soft)}
  .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
  .menu{position:fixed;z-index:55;display:none;background:#fff;border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 10px 30px rgba(20,25,35,.18);padding:5px;min-width:180px}
  .menu.show{display:block}
  .menu button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:9px 11px;border-radius:7px;font-size:13px;color:var(--ink)}
  .menu button:hover{background:var(--accent-soft)}
  .menu .menurow{display:flex;align-items:center;gap:6px;padding:7px 11px;font-size:13px;color:var(--ink)}
  .menu .menurow input{width:52px;border:1px solid var(--line-strong);border-radius:6px;padding:4px 6px;font-size:13px;font-family:var(--sans)}
  .menu .menurow button{width:auto;display:inline-block;padding:5px 10px;background:var(--accent-soft);color:var(--accent-ink);font-weight:550}
  .btn.icon{padding:8px}
  .btn:disabled{opacity:.42;cursor:not-allowed}

  .workspace{flex:1;display:flex;min-height:0}
  .sidebar{flex:none;width:248px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
  .side-head{flex:none;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px;}
  .side-title{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
  .side-title .count{font-family:var(--mono);color:var(--ink);background:#f1f2f6;padding:1px 7px;border-radius:20px;font-size:11px}
  .selall{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
  .selall input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
  .side-ops{display:flex;gap:4px}
  .side-ops .btn{padding:7px 9px;font-size:12px;flex:1;justify-content:center}

  .thumbs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px}
  .thumb{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:#fbfbfd;padding:9px 10px;display:flex;gap:10px;align-items:center;cursor:pointer;transition:border-color .12s,box-shadow .12s,background .12s;}
  .thumb:hover{background:#fff;border-color:var(--line-strong)}
  .thumb.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .thumb.selected{background:var(--accent-soft)}
  .thumb.dragging{opacity:.4}
  .thumb.drop-before{box-shadow:0 -2px 0 0 var(--accent)}
  .thumb.drop-after{box-shadow:0 2px 0 0 var(--accent)}
  .thumb .grip{color:var(--faint);flex:none;display:flex;cursor:grab}
  .thumb .chk{accent-color:var(--accent);width:15px;height:15px;flex:none;cursor:pointer}
  .thumb .pv{flex:none;width:56px;min-height:40px;background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .thumb .pv img{display:block;width:100%;height:auto}
  .thumb .pv .ph{width:100%;height:70px;background:linear-gradient(100deg,#f2f3f6,#e9ebf0,#f2f3f6);background-size:200% 100%;animation:sh 1.1s linear infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .thumb .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .thumb .idx{font-family:var(--mono);font-size:13px;font-weight:600}
  .thumb .src{font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thumb .tags{display:flex;gap:5px}
  .thumb .rot{font-family:var(--mono);font-size:10px;color:var(--accent)}
  .thumb .mk{font-family:var(--mono);font-size:10px;color:#0f9d58}
  .thumb .pnum{font-family:var(--mono);font-size:10px;color:var(--accent-ink);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .thumb .bl{font-family:var(--mono);font-size:10px;color:var(--faint)}
  .thumb .acts{position:absolute;top:6px;right:7px;display:flex;gap:2px;opacity:0;transition:opacity .12s}
  .thumb:hover .acts,.thumb.current .acts{opacity:1}
  .mini{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:6px;padding:4px;color:var(--muted);display:flex;line-height:0}
  .mini:hover{color:var(--ink);background:#fff}
  .mini.del:hover{color:var(--danger);border-color:var(--danger)}
  .mini svg{width:13px;height:13px}

  .viewer{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .vbar{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);}
  .pageind{font-family:var(--mono);font-size:12.5px;color:var(--muted);min-width:112px}
  .pageind b{color:var(--ink)}
  .zoom{display:flex;align-items:center;gap:2px;margin-left:auto}
  .zval{font-family:var(--mono);font-size:12px;color:var(--muted);width:48px;text-align:center}

  .drawbar{flex:none;display:flex;align-items:center;gap:8px;padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line);overflow-x:auto}
  .tgrp{display:flex;gap:3px;align-items:center}
  .tool{border:1px solid transparent;background:transparent;border-radius:7px;padding:6px;color:var(--muted);display:flex;line-height:0}
  .tool svg{width:17px;height:17px}
  .tool:hover{background:#eef0f4;color:var(--ink)}
  .tool.active{background:var(--accent);color:#fff}
  .dsep{width:1px;height:22px;background:var(--line);flex:none}
  .sw{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-strong);cursor:pointer;padding:0}
  .sw.active{box-shadow:0 0 0 2px var(--accent)}
  .sw.white{border-color:#eee}
  .cpick{width:26px;height:26px;padding:0;border:1px solid var(--line-strong);border-radius:6px;background:#fff;cursor:pointer}
  .wsel{display:flex;gap:3px}
  .wbtn{border:1px solid var(--line-strong);background:#fff;border-radius:6px;width:30px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .wbtn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .wbtn .dot{border-radius:50%;background:currentColor}
  .dlabel{font-size:11px;color:var(--faint);margin-right:2px}

  .stage{flex:1;overflow:auto;min-height:0;
    background:linear-gradient(90deg,rgba(120,128,145,.05) 1px,transparent 1px) 0 0/26px 26px,
      linear-gradient(rgba(120,128,145,.05) 1px,transparent 1px) 0 0/26px 26px,var(--bg);
    display:flex;align-items:flex-start;justify-content:center;padding:34px;}
  .pageWrap{position:relative;box-shadow:var(--shadow);border-radius:2px;background:var(--paper)}
  #mainCanvas{display:block;border-radius:2px}
  #overlay{position:absolute;top:0;left:0;touch-action:none}
  .stage.draw #overlay{cursor:crosshair}
  .stage.text #overlay{cursor:text}
  .stage.erase #overlay{cursor:cell}
  .tinput{position:absolute;z-index:9;border:1px solid var(--accent);border-radius:4px;padding:2px 5px;font-family:var(--sans);background:#fff;box-shadow:var(--shadow);outline:none;min-width:80px}

  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:8;background:var(--bg)}
  body.has-pages .empty{display:none}
  .drop{width:min(560px,92vw);background:var(--panel);border:2px dashed var(--line-strong);border-radius:16px;padding:52px 40px;text-align:center;transition:border-color .15s,background .15s;}
  .drop.over{border-color:var(--accent);background:var(--accent-soft)}
  .drop .ic{width:52px;height:52px;color:var(--accent);margin:0 auto 18px}
  .drop h1{margin:0 0 8px;font-size:20px;letter-spacing:-.01em}
  .drop p{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.6}
  .drop .hint{margin-top:18px;font-family:var(--mono);font-size:11px;color:var(--faint)}

  .fileveil{position:fixed;inset:0;z-index:20;background:rgba(67,56,202,.08);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;pointer-events:none}
  body.dragfile .fileveil{display:flex}
  .fileveil span{background:var(--accent);color:#fff;padding:10px 20px;border-radius:30px;font-weight:600;font-size:14px}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(20,25,35,.35);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.show{display:flex}
  .sheet{background:#fff;border-radius:14px;width:min(384px,94vw);box-shadow:0 20px 60px rgba(20,25,35,.28);overflow:hidden}
  .sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:650;font-size:15px}
  .sheet header .x{border:none;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
  .sheet header .x:hover{background:#f0f1f5;color:var(--ink)}
  .sheet .body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
  .frow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
  .frow>label{color:var(--muted)}
  .frow select,.frow input[type=number],.frow input[type=text]{font-family:var(--sans);border:1px solid var(--line-strong);border-radius:7px;padding:6px 8px;font-size:13px;background:#fff}
  .frow select{min-width:150px}
  .frow input[type=number]{width:84px}
  .frow input[type=text]{width:150px}
  .frow input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--line-strong);border-radius:6px;background:#fff}
  .chkrow{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
  .chkrow input{accent-color:var(--accent);width:16px;height:16px}
  .sheet footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:80vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--danger)}
  .busy{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:70;transition:width .2s ease;opacity:0}
  .busy.on{opacity:1}

  @media (max-width:860px){
    .workspace{flex-direction:column}
    .sidebar{width:100%;height:170px;border-right:none;border-bottom:1px solid var(--line)}
    .thumbs{flex-direction:row;overflow-x:auto;overflow-y:hidden}
    .thumb{width:210px;flex:none}
    .brand .tag{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="busy" id="busy"></div>

  <header class="topbar">
    <div class="brand">
      <div class="name">PDF <b>工作台</b></div>
      <div class="tag">local · 純本機處理，不上傳</div>
    </div>
    <div class="tools">
      <button class="btn" id="btnOpen" title="開啟或加入 PDF（有頁面時可選插入位置）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>開啟 / 加入 PDF</button>
      <button class="btn" id="btnBlank" disabled title="在目前頁面後插入一張空白頁">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>插入空白頁</button>
      <button class="btn" id="btnPnum" disabled title="加入頁碼設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16M18 4v16M6 20h4"/><path d="M15 14a2 2 0 1 1 3 1.7L15 20h4"/></svg>頁碼</button>
      <button class="btn" id="btnNup" disabled title="版面合併 / N-up（例如 2 張 A4 → 1 張 A3）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="16" rx="1"/><rect x="13" y="4" width="8" height="16" rx="1"/></svg>版面合併</button>
      <button class="btn" id="btnCmp" disabled title="壓縮 / 縮小檔案（適合掃描或圖片型 PDF）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4M8 12h8"/></svg>壓縮</button>
      <button class="btn" id="btnExtract" disabled title="把勾選的頁面另存成新的 PDF 下載">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>下載所選</button>
      <button class="btn" id="btnPng" disabled title="把勾選（或目前）頁面匯出成 PNG 圖片">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-5-5L5 21"/></svg>匯出 PNG</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="btnClear" disabled title="清空全部並重新開始">清除</button>
      <button class="btn primary" id="btnDownload" disabled title="依目前順序、旋轉、標註與頁碼輸出 PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>下載 PDF</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar">
      <div class="side-head">
        <div class="side-title">頁面 <span class="count" id="pgCount">0</span>
          <label class="selall" style="margin-left:auto"><input type="checkbox" id="selAll"> 全選</label>
        </div>
        <div class="side-ops">
          <button class="btn" id="btnRotL" disabled title="所選（或目前）頁面向左轉 90°">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>左轉</button>
          <button class="btn" id="btnRotR" disabled title="所選（或目前）頁面向右轉 90°">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>右轉</button>
          <button class="btn danger" id="btnDel" disabled title="刪除所選（或目前）頁面">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>刪除</button>
        </div>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </aside>

    <section class="viewer">
      <div class="vbar">
        <button class="btn icon ghost" id="btnUndo" disabled title="復原 (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
        <button class="btn icon ghost" id="btnRedo" disabled title="重作 (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
        <div class="dsep"></div>
        <div class="pageind" id="pageInd">第 — / — 頁</div>
        <div class="zoom">
          <button class="btn icon ghost" id="zOut" title="縮小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-4.3-4.3"/></svg></button>
          <span class="zval" id="zVal">—</span>
          <button class="btn icon ghost" id="zIn" title="放大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M21 21l-4.3-4.3"/></svg></button>
          <button class="btn ghost" id="zFit" title="符合寬度" style="font-size:12px">符合寬度</button>
        </div>
      </div>

      <div class="drawbar" id="drawbar">
        <div class="tgrp" id="toolSet">
          <button class="tool active" data-tool="none" title="瀏覽 / 選取（不繪圖）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l7 16 2-7 7-2z"/></svg></button>
          <button class="tool" data-tool="pen" title="畫筆 / 簽名"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7a2.8 2.8 0 0 0-4-4l-7 7-1 5z"/><path d="M2 22c3-1 5-1 7 0"/></svg></button>
          <button class="tool" data-tool="marker" title="螢光筆"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h6"/><path d="M14 4l6 6-8 8H7l-2-2z"/></svg></button>
          <button class="tool" data-tool="line" title="直線"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19L19 5"/></svg></button>
          <button class="tool" data-tool="arrow" title="箭頭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5M11 5h8v8"/></svg></button>

  <div class="menu" id="openMenu">
    <button data-mode="start">插入到文件最前</button>
    <button data-mode="after">插入到本頁之後</button>
    <div class="menurow">插入到第 <input type="number" id="openAfterN" min="1" value="1"> 頁後 <button id="openAfterGo">確定</button></div>
    <button data-mode="end">插入到文件最後</button>

  <div class="fileveil"><span>放開以加入 PDF</span></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>

<script>
(function(){
  "use strict";
  const { PDFDocument, degrees } = PDFLib;
  pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js";

  // ---------- state ----------
  const docs = new Map();
  let pages = [];
  const ann = new Map();
  let currentUid = null;
  const selected = new Set();
  let zoom = 1.2, uidN = 0, docN = 0;
  const thumbCache = new Map();
  let mainTask = null, dragUid = null, curVP = null, curDpr = 1;

  let tool = "none", color = "#4338ca", sizeKey = "medium", drawing = null, erasing = false, erasedFlag = false;
  const SIZES = { small:{w:1.5,t:13}, medium:{w:3,t:19}, large:{w:6,t:30} };
  const SWATCHES = ["#111827","#1d4ed8","#dc2626","#0f9d58","#f5b400","#ffffff"];

  const $ = id => document.getElementById(id);
  const els = {
    file:$("file"), thumbs:$("thumbs"), stage:$("stage"), wrap:$("pageWrap"),
    canvas:$("mainCanvas"), overlay:$("overlay"),
    pgCount:$("pgCount"), pageInd:$("pageInd"), zVal:$("zVal"), selAll:$("selAll"),
    toast:$("toast"), busy:$("busy"), drop:$("drop"),
    btnOpen:$("btnOpen"), btnBlank:$("btnBlank"), btnPnum:$("btnPnum"),
    btnExtract:$("btnExtract"), btnPng:$("btnPng"), btnDownload:$("btnDownload"),
    btnClear:$("btnClear"), btnRotL:$("btnRotL"), btnRotR:$("btnRotR"), btnDel:$("btnDel"),
    btnUndo:$("btnUndo"), btnRedo:$("btnRedo"), btnClearAnn:$("btnClearAnn"), pnModal:$("pnModal"),
  };

  // ---------- history (undo / redo) ----------
  const deepClone = (typeof structuredClone==="function") ? structuredClone : (x=>JSON.parse(JSON.stringify(x)));
  let history=[], hi=-1; const HISTMAX=100;
  function snapshot(){
    return { pages:pages.map(p=>({...p, num:p.num?{...p.num}:null})), ann:[...ann.entries()].map(([k,v])=>[k,deepClone(v)]), current:currentUid };
  }
  function commit(){
    history=history.slice(0,hi+1);
    history.push(snapshot());
    if(history.length>HISTMAX) history.shift();
    hi=history.length-1;
    updateHistBtns();
  }
  function restore(s){
    pages=s.pages.map(p=>({...p}));
    ann.clear(); s.ann.forEach(([k,v])=>ann.set(k,deepClone(v)));
    currentUid=(s.current && pages.find(p=>p.uid===s.current)) ? s.current : (pages[0]?.uid??null);
    selected.clear(); drawing=null; erasing=false; thumbCache.clear();
    document.body.classList.toggle("has-pages", pages.length>0);
    if(!pages.length){ els.canvas.width=els.canvas.height=0; els.overlay.width=els.overlay.height=0; }
    renderThumbs(); renderMain(); markCurrent(); updateUI();
  }
  function undo(){ if(hi>0){ hi--; restore(history[hi]); updateHistBtns(); } }
  function redo(){ if(hi<history.length-1){ hi++; restore(history[hi]); updateHistBtns(); } }
  function updateHistBtns(){ els.btnUndo.disabled=hi<=0; els.btnRedo.disabled=hi>=history.length-1; }

  const delay = ms => new Promise(r=>setTimeout(r,ms));
  let toastT;
  function toast(m,err){ els.toast.textContent=m; els.toast.className="toast show"+(err?" err":""); clearTimeout(toastT); toastT=setTimeout(()=>els.toast.className="toast",2800); }
  let busyC=0;
  function busy(on){ busyC+=on?1:-1; if(busyC<0)busyC=0;
    if(busyC>0){els.busy.classList.add("on");els.busy.style.width="70%";}
    else{els.busy.style.width="100%";setTimeout(()=>{els.busy.classList.remove("on");els.busy.style.width="0";},220);} }
  function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function dataURLtoBytes(u){ const b=atob(u.split(",")[1]); const a=new Uint8Array(b.length); for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a; }
  function fmtBytes(n){ if(n<1024)return n+" B"; if(n<1048576)return (n/1024).toFixed(0)+" KB"; return (n/1048576).toFixed(2)+" MB"; }

  // ---------- load ----------
  async function registerDoc(name, bytes){
    const doc=await pdfjsLib.getDocument({data:bytes.slice()}).promise;
    const docId="d"+(docN++); docs.set(docId,{name,bytes,doc,pageCount:doc.numPages});
    return {docId,doc};
  }
  function insertIndexFor(mode, page){
    if(mode==="start") return 0;
    if(mode==="end") return pages.length;
    if(mode==="afterPage"){ const n=Math.max(1,Math.min(pages.length, page||pages.length)); return n; }
    if(currentUid){ const i=pages.findIndex(p=>p.uid===currentUid); return i>=0?i+1:pages.length; }
    return pages.length;
  }
  async function loadFiles(fileList, insert){
    insert = insert || {mode:"end"};
    const files=[...fileList].filter(f=>/pdf$/i.test(f.name)||f.type==="application/pdf");
    if(!files.length){ toast("請選擇 PDF 檔",true); return; }
    busy(true); let added=0; const newPages=[];
    for(const f of files){
      try{
        const bytes=new Uint8Array(await f.arrayBuffer());
        const {docId,doc}=await registerDoc(f.name,bytes);
        for(let i=0;i<doc.numPages;i++) newPages.push({uid:"p"+(uidN++),docId,srcIndex:i,rotation:0});
        added++;
      }catch(e){ console.error(e); toast("無法讀取「"+f.name+"」，可能已加密或損毀",true); }
    }
    if(newPages.length){
      const idx=insertIndexFor(insert.mode, insert.page);
      pages.splice(idx,0,...newPages);
      currentUid=newPages[0].uid;
    }
    busy(false); renderThumbs(); renderMain(); markCurrent(); updateUI();
    if(added){ commit(); toast("已加入 "+added+" 個檔案（"+newPages.length+" 頁），共 "+pages.length+" 頁");
      const node=els.thumbs.querySelector('.thumb[data-uid="'+currentUid+'"]'); if(node)node.scrollIntoView({block:"nearest"}); }
  }
  async function insertBlank(position){
    position=position||"after";
    let ref=null;
    if(position==="start") ref=pages[0];
    else if(position==="end") ref=pages[pages.length-1];
    else ref=pages.find(p=>p.uid===currentUid)||pages[0];
    let w=595.28,h=841.89;
    if(ref){ try{ const pg=await docs.get(ref.docId).doc.getPage(ref.srcIndex+1); const vp=pg.getViewport({scale:1,rotation:0}); w=vp.width;h=vp.height; }catch(e){} }
    busy(true);
    try{
      const tmp=await PDFDocument.create(); tmp.addPage([w,h]); const bytes=await tmp.save();
      const {docId}=await registerDoc("空白頁",bytes);
      const np={uid:"p"+(uidN++),docId,srcIndex:0,rotation:0,blank:true};
      let idx;
      if(position==="start") idx=0;
      else if(position==="end") idx=pages.length;
      else idx=currentUid?pages.findIndex(p=>p.uid===currentUid)+1:pages.length;
      pages.splice(idx,0,np); currentUid=np.uid;
      document.body.classList.add("has-pages");
      renderThumbs(); renderMain(); markCurrent(); updateUI(); commit();
      const node=els.thumbs.querySelector('.thumb[data-uid="'+np.uid+'"]'); if(node)node.scrollIntoView({block:"nearest"});
      toast("已插入空白頁（"+Math.round(w)+"×"+Math.round(h)+" pt）");
    }catch(e){ console.error(e); toast("插入失敗",true); } finally{ busy(false); }
  }

  // ---------- page number ----------
  const PN_MARGIN = 28;
  function drawPageNumber(ctx, num, map, ws, Wp, Hp){
    if(!num||!num.text) return;
    const m=PN_MARGIN, size=num.size, pos=num.pos;
    let x, align;
    if(pos.indexOf("center")>=0){ x=Wp/2; align="center"; }
    else if(pos.indexOf("right")>=0){ x=Wp-m; align="right"; }
    else { x=m; align="left"; }
    const baselineY = pos.indexOf("bottom")>=0 ? m : (Hp - m - size);
    const [tx,ty]=map(x,baselineY);
    ctx.save();
    ctx.globalAlpha=1; ctx.fillStyle=num.color; ctx.textAlign=align; ctx.textBaseline="alphabetic";
    ctx.font=(size*ws)+'px -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
    ctx.fillText(num.text,tx,ty);
    ctx.restore();
  }

  // ---------- shape painting ----------
  function arrowHead(ctx,x1,y1,x2,y2,w){
    const a=Math.atan2(y2-y1,x2-x1), len=Math.max(w*3.2,7*(w/3+.5));
    ctx.beginPath(); ctx.moveTo(x2,y2);
    ctx.lineTo(x2-len*Math.cos(a-Math.PI/7), y2-len*Math.sin(a-Math.PI/7));
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2-len*Math.cos(a+Math.PI/7), y2-len*Math.sin(a+Math.PI/7));
    ctx.stroke();
  }
  function paintShapes(ctx, shapes, map, ws){
    ctx.lineCap="round"; ctx.lineJoin="round";
    for(const s of shapes){
      ctx.strokeStyle=s.color; ctx.fillStyle=s.color;
      ctx.globalAlpha = s.type==="marker" ? 0.35 : 1;
      ctx.lineWidth = (s.type==="marker"? s.width*3.4 : s.width) * ws;
      if(s.type==="pen"||s.type==="marker"){
        ctx.beginPath();
        s.points.forEach((p,i)=>{ const [x,y]=map(p[0],p[1]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
        if(s.points.length===1){ const [x,y]=map(s.points[0][0],s.points[0][1]); ctx.lineTo(x+0.1,y+0.1); }
        ctx.stroke();
      }else if(s.type==="line"||s.type==="arrow"){
        const [x1,y1]=map(s.a[0],s.a[1]), [x2,y2]=map(s.b[0],s.b[1]);
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        if(s.type==="arrow") arrowHead(ctx,x1,y1,x2,y2,s.width*ws);
      }else if(s.type==="rect"){
        const [x1,y1]=map(s.a[0],s.a[1]), [x2,y2]=map(s.b[0],s.b[1]);
        ctx.strokeRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1));
      }else if(s.type==="text"){
        const [x,y]=map(s.pos[0],s.pos[1]);
        ctx.globalAlpha=1; ctx.textBaseline="top"; ctx.textAlign="left";
        ctx.font=(s.size*ws)+'px -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
        ctx.fillText(s.text,x,y);
      }
      ctx.globalAlpha=1;
    }
  }

  // ---------- render page (annotations + page number) ----------
  async function renderStatic(page, targetW){
    const d=docs.get(page.docId), pg=await d.doc.getPage(page.srcIndex+1);
    const rot=(pg.rotate+page.rotation)%360;
    let vp=pg.getViewport({scale:1,rotation:rot});
    vp=pg.getViewport({scale:targetW/vp.width,rotation:rot});
    const c=document.createElement("canvas"); c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
    const ctx=c.getContext("2d");
    await pg.render({canvasContext:ctx,viewport:vp}).promise;
    const shapes=ann.get(page.uid);
    if(shapes&&shapes.length) paintShapes(ctx,shapes,(px,py)=>vp.convertToViewportPoint(px,py),vp.scale);
    drawPageNumber(ctx, page.num, (px,py)=>vp.convertToViewportPoint(px,py), vp.scale, vp.viewBox[2]-vp.viewBox[0], vp.viewBox[3]-vp.viewBox[1]);
    return c;
  }
  function thumbURL(page){
    if(!thumbCache.has(page.uid)) thumbCache.set(page.uid, renderStatic(page,150).then(c=>c.toDataURL("image/png")));
    return thumbCache.get(page.uid);
  }
  function invalidateThumb(uid){ thumbCache.delete(uid); }
  function refreshThumb(uid){
    invalidateThumb(uid);
    const page=pages.find(p=>p.uid===uid);
    const pv=els.thumbs.querySelector('.thumb[data-uid="'+uid+'"] .pv');
    if(pv&&page) thumbURL(page).then(u=>{pv.innerHTML="";const img=new Image();img.src=u;pv.appendChild(img);});
    const tg=els.thumbs.querySelector('.thumb[data-uid="'+uid+'"] .tags');
    if(tg&&page) tg.innerHTML=tagHTML(page);
  }
  function tagHTML(page){
    let h="";
    if(page.blank) h+='<span class="bl">空白</span>';
    if(page.rotation) h+='<span class="rot">↻ '+page.rotation+'°</span>';
    if(page.num) h+='<span class="pnum">№ '+escapeHtml(page.num.text)+'</span>';
    const n=(ann.get(page.uid)||[]).length; if(n) h+='<span class="mk">✎ '+n+'</span>';

      item.addEventListener("dragend",()=>{dragUid=null;clearDropMarks();item.classList.remove("dragging");});
      item.addEventListener("dragover",e=>{e.preventDefault();if(!dragUid||dragUid===page.uid)return;
        const r=item.getBoundingClientRect(); clearDropMarks();
        item.classList.add(e.clientY>r.top+r.height/2?"drop-after":"drop-before");});
      item.addEventListener("drop",e=>{e.preventDefault();if(!dragUid||dragUid===page.uid){clearDropMarks();return;}
        const r=item.getBoundingClientRect(); reorder(dragUid,page.uid,e.clientY>r.top+r.height/2);});

  function clearDropMarks(){ els.thumbs.querySelectorAll(".drop-before,.drop-after").forEach(n=>n.classList.remove("drop-before","drop-after")); }
  function markCurrent(){ els.thumbs.querySelectorAll(".thumb").forEach(n=>n.classList.toggle("current",n.dataset.uid===currentUid)); updateUI(); }
  function reorder(fromUid,targetUid,after){
    const fi=pages.findIndex(p=>p.uid===fromUid); if(fi<0)return;
    const [m]=pages.splice(fi,1);
    let ti=pages.findIndex(p=>p.uid===targetUid); if(after)ti++;

  // ---------- main preview ----------
  async function renderMain(){
    if(!currentUid){ els.overlay.getContext("2d").clearRect(0,0,els.overlay.width,els.overlay.height); return; }
    const page=pages.find(p=>p.uid===currentUid); if(!page)return;
    const dpr=window.devicePixelRatio||1;
    try{
      const d=docs.get(page.docId), pg=await d.doc.getPage(page.srcIndex+1);
      const rot=(pg.rotate+page.rotation)%360;
      const vp=pg.getViewport({scale:zoom*dpr,rotation:rot});
      els.canvas.width=Math.ceil(vp.width); els.canvas.height=Math.ceil(vp.height);
      els.canvas.style.width=(vp.width/dpr)+"px"; els.canvas.style.height=(vp.height/dpr)+"px";
      els.overlay.width=els.canvas.width; els.overlay.height=els.canvas.height;
      els.overlay.style.width=els.canvas.style.width; els.overlay.style.height=els.canvas.style.height;
      if(mainTask){ try{mainTask.cancel();}catch(e){} }
      mainTask=pg.render({canvasContext:els.canvas.getContext("2d"),viewport:vp});
      curVP=vp; curDpr=dpr;
      await mainTask.promise;
      drawOverlay();
    }catch(e){ if(e&&e.name!=="RenderingCancelledException")console.error(e); }
    updateUI();
  }
  function drawOverlay(){
    const ctx=els.overlay.getContext("2d");
    ctx.clearRect(0,0,els.overlay.width,els.overlay.height);
    if(!curVP||!currentUid)return;
    const page=pages.find(p=>p.uid===currentUid);
    const shapes=(ann.get(currentUid)||[]).slice();
    if(drawing) shapes.push(drawing);
    paintShapes(ctx,shapes,(px,py)=>curVP.convertToViewportPoint(px,py),curVP.scale);
    drawPageNumber(ctx, page.num, (px,py)=>curVP.convertToViewportPoint(px,py), curVP.scale, curVP.viewBox[2]-curVP.viewBox[0], curVP.viewBox[3]-curVP.viewBox[1]);
  }

  // ---------- page ops ----------
  function targets(){ if(selected.size)return[...selected]; return currentUid?[currentUid]:[]; }
  function rotatePages(uids,delta){
    const s=new Set(uids);
    pages.forEach(p=>{ if(s.has(p.uid)){ p.rotation=(p.rotation+delta+360)%360; invalidateThumb(p.uid);} });
    renderThumbs(); renderMain(); markCurrent(); commit();
  }
  function deletePages(uids){
    const s=new Set(uids);
    pages=pages.filter(p=>!s.has(p.uid));
    s.forEach(u=>{selected.delete(u);ann.delete(u);invalidateThumb(u);});
    if(!pages.find(p=>p.uid===currentUid)) currentUid=pages[0]?.uid??null;
    renderThumbs(); renderMain(); updateUI();
    if(!pages.length) document.body.classList.remove("has-pages");
    commit();
  }

  // ---------- drawing ----------
  function evtPoint(e){
    const r=els.overlay.getBoundingClientRect();
    const sx=(e.clientX-r.left)*(els.overlay.width/r.width);
    const sy=(e.clientY-r.top)*(els.overlay.height/r.height);
    const [px,py]=curVP.convertToPdfPoint(sx,sy);
    return { px, py, cssx:e.clientX-r.left, cssy:e.clientY-r.top };
  }
  function onDown(e){
    if(tool==="none"||!currentUid||!curVP) return;
    e.preventDefault(); els.overlay.setPointerCapture(e.pointerId);
    const p=evtPoint(e), s=SIZES[sizeKey];
    if(tool==="text"){ openText(p); return; }
    if(tool==="eraser"){ erasing=true; erasedFlag=false; if(eraseAt(p.px,p.py)) erasedFlag=true; return; }
    if(tool==="pen"||tool==="marker") drawing={type:tool,color,width:s.w,points:[[p.px,p.py]]};
    else if(tool==="line"||tool==="arrow") drawing={type:tool,color,width:s.w,a:[p.px,p.py],b:[p.px,p.py]};
    else if(tool==="rect") drawing={type:"rect",color,width:s.w,a:[p.px,p.py],b:[p.px,p.py]};
    drawOverlay();
  }
  function onMove(e){
    if(!currentUid||!curVP) return;
    if(erasing){ const p=evtPoint(e); if(eraseAt(p.px,p.py)) erasedFlag=true; return; }
    if(!drawing) return;
    const p=evtPoint(e);
    if(drawing.type==="pen"||drawing.type==="marker") drawing.points.push([p.px,p.py]);
    else drawing.b=[p.px,p.py];
    drawOverlay();
  }
  function onUp(){
    if(erasing){ erasing=false; if(erasedFlag){ erasedFlag=false; commit(); } return; }
    if(!drawing) return;
    const list=ann.get(currentUid)||[]; list.push(drawing); ann.set(currentUid,list);
    drawing=null; refreshThumb(currentUid); drawOverlay(); updateUI(); commit();
  }
  function eraseAt(px,py){
    const list=ann.get(currentUid); if(!list||!list.length)return false;
    for(let i=list.length-1;i>=0;i--){ if(hitShape(list[i],px,py)){ list.splice(i,1); refreshThumb(currentUid); drawOverlay(); updateUI(); return true; } }
    return false;
  }
  function d2seg(px,py,ax,ay,bx,by){
    const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;
    let t=l?((px-ax)*dx+(py-ay)*dy)/l:0; t=Math.max(0,Math.min(1,t));
    return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
  }
  function hitShape(s,px,py){
    const th=Math.max(6,(s.type==="marker"?s.width*3.4:s.width))+3;
    if(s.type==="pen"||s.type==="marker"){ for(let i=1;i<s.points.length;i++) if(d2seg(px,py,s.points[i-1][0],s.points[i-1][1],s.points[i][0],s.points[i][1])<th)return true; if(s.points.length===1)return Math.hypot(px-s.points[0][0],py-s.points[0][1])<th; return false; }
    if(s.type==="line"||s.type==="arrow") return d2seg(px,py,s.a[0],s.a[1],s.b[0],s.b[1])<th;
    if(s.type==="rect"){ const x1=Math.min(s.a[0],s.b[0]),x2=Math.max(s.a[0],s.b[0]),y1=Math.min(s.a[1],s.b[1]),y2=Math.max(s.a[1],s.b[1]);
      return d2seg(px,py,x1,y1,x2,y1)<th||d2seg(px,py,x2,y1,x2,y2)<th||d2seg(px,py,x2,y2,x1,y2)<th||d2seg(px,py,x1,y2,x1,y1)<th; }
    if(s.type==="text"){ const w=s.text.length*s.size*0.6,h=s.size; return px>=s.pos[0]-4&&px<=s.pos[0]+w+4&&py<=s.pos[1]+4&&py>=s.pos[1]-h-4; }
    return false;
  }
  function openText(p){
    const inp=document.createElement("input"); inp.className="tinput"; inp.type="text"; inp.placeholder="輸入文字…";
    inp.style.left=p.cssx+"px"; inp.style.top=p.cssy+"px";
    inp.style.fontSize=(SIZES[sizeKey].t*zoom)+"px"; inp.style.color=color;
    els.wrap.appendChild(inp); inp.focus();
    let done=false;
    const commitText=()=>{ if(done)return; done=true; const v=inp.value.trim(); inp.remove();
      if(v){ const list=ann.get(currentUid)||[]; list.push({type:"text",color,size:SIZES[sizeKey].t,pos:[p.px,p.py],text:v}); ann.set(currentUid,list); refreshThumb(currentUid); drawOverlay(); updateUI(); commit(); } };
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();commitText();} else if(e.key==="Escape"){done=true;inp.remove();} });
    inp.addEventListener("blur",commitText);
  }
  function clearAnnPage(){ const l=ann.get(currentUid); if(l&&l.length){ ann.set(currentUid,[]); refreshThumb(currentUid); drawOverlay(); updateUI(); commit(); toast("已清除本頁標註"); } }

  // ---------- build / bake / save ----------
  async function bakeInto(outDoc, libPage, page){
    const shapes=ann.get(page.uid)||[];
    const num=page.num;
    if(!shapes.length && !num) return;
    const {width:Wp,height:Hp}=libPage.getSize();
    const R=3, c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(Wp*R)); c.height=Math.max(1,Math.round(Hp*R));
    const ctx=c.getContext("2d"); ctx.scale(R,R);
    if(shapes.length) paintShapes(ctx, shapes, (px,py)=>[px,Hp-py], 1);
    drawPageNumber(ctx, num, (px,py)=>[px,Hp-py], 1, Wp, Hp);
    const img=await outDoc.embedPng(dataURLtoBytes(c.toDataURL("image/png")));
    libPage.drawImage(img,{x:0,y:0,width:Wp,height:Hp});
  }
  async function buildPdf(list){
    const out=await PDFDocument.create(); const cache=new Map();
    for(let i=0;i<list.length;i++){
      const p=list[i];
      let src=cache.get(p.docId);
      if(!src){ src=await PDFDocument.load(docs.get(p.docId).bytes,{ignoreEncryption:true}); cache.set(p.docId,src); }
      const [cp]=await out.copyPages(src,[p.srcIndex]);
      cp.setRotation(degrees((cp.getRotation().angle+p.rotation)%360));
      out.addPage(cp);
      await bakeInto(out,cp,p);
    }
    return out.save();
  }
  function saveBlob(bytes,name,mime){
    const url=URL.createObjectURL(new Blob([bytes],{type:mime}));
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }
  async function downloadAll(){

    catch(e){ console.error(e); toast("輸出失敗："+(e.message||"未知錯誤"),true); } finally{ busy(false); }

    list.forEach((p,i)=>{

  // ---------- N-up 版面合併 ----------
  function sheetSize(name, orient){
    const S={A4:[595.28,841.89],A3:[841.89,1190.55],Letter:[612,792]}[name]||[595.28,841.89];
    let w=S[0],h=S[1];
    if(orient==="landscape"){ if(w<h)[w,h]=[h,w]; } else { if(w>h)[w,h]=[h,w]; }
    return [w,h];
  }
  function gridFor(count, landscape){
    if(count===2) return landscape?[2,1]:[1,2];
    if(count===4) return [2,2];
    if(count===6) return landscape?[3,2]:[2,3];
    if(count===9) return [3,3];
    if(count===16) return [4,4];
    return [2,1];
  }
  function readNup(){
    return {
      count:parseInt($("nuCount").value,10),
      sheet:$("nuSheet").value, orient:$("nuOrient").value,
      gap:parseFloat($("nuGap").value), margin:parseFloat($("nuMargin").value),
      dpi:parseInt($("nuDpi").value,10), scope:$("nuScope").value,
    };
  }
  function nupList(cfg){ return cfg.scope==="selected"?pages.filter(p=>selected.has(p.uid)):pages.slice(); }
  function updateNupDesc(){
    const cfg=readNup(); const list=nupList(cfg);
    const [c,r]=gridFor(cfg.count, cfg.orient==="landscape"); const per=c*r;
    const sheets=Math.ceil(list.length/per)||0;
    const label={A4:"A4",A3:"A3",Letter:"Letter"}[cfg.sheet]+(cfg.orient==="landscape"?" 橫向":" 直向");
    $("nuDesc").textContent = list.length
      ? list.length+" 頁 → "+sheets+" 張 "+label+"（每張 "+per+" 頁，"+c+"×"+r+" 排列）"
      : (cfg.scope==="selected"?"尚未勾選任何頁面。":"尚無頁面。");
  }
  async function pagePointSize(page){
    const pg=await docs.get(page.docId).doc.getPage(page.srcIndex+1);
    const vp=pg.getViewport({scale:1,rotation:(pg.rotate+page.rotation)%360});
    return {wpt:vp.width,hpt:vp.height};
  }
  async function buildNup(cfg){
    const list=nupList(cfg);
    if(!list.length) throw new Error("沒有可合併的頁面");
    const landscape=cfg.orient==="landscape";
    const [cols,rows]=gridFor(cfg.count,landscape); const per=cols*rows;
    const [W,H]=sheetSize(cfg.sheet,cfg.orient);
    const m=cfg.margin,g=cfg.gap;
    const cellW=(W-2*m-(cols-1)*g)/cols, cellH=(H-2*m-(rows-1)*g)/rows;
    const out=await PDFDocument.create();
    for(let i=0;i<list.length;i+=per){
      const sheet=out.addPage([W,H]);
      for(let k=0;k<per && i+k<list.length;k++){
        const page=list[i+k];
        const col=k%cols, row=Math.floor(k/cols);
        const cx=m+col*(cellW+g);
        const cellBottom=H-m-row*(cellH+g)-cellH;
        const {wpt,hpt}=await pagePointSize(page);
        const scale=Math.min(cellW/wpt, cellH/hpt);
        const drawW=wpt*scale, drawH=hpt*scale;
        const dx=cx+(cellW-drawW)/2, dy=cellBottom+(cellH-drawH)/2;
        const canvas=await renderStatic(page, Math.max(1,Math.round(wpt/72*cfg.dpi)));
        const png=await out.embedPng(dataURLtoBytes(canvas.toDataURL("image/png")));
        sheet.drawImage(png,{x:dx,y:dy,width:drawW,height:drawH});
      }
    }
    return out.save();
  }
  async function loadImposed(bytes, name){
    const {docId,doc}=await registerDoc(name||"N-up 合併",bytes);
    pages=[]; ann.clear(); selected.clear(); drawing=null; erasing=false; thumbCache.clear();
    for(let i=0;i<doc.numPages;i++) pages.push({uid:"p"+(uidN++),docId,srcIndex:i,rotation:0});
    currentUid=pages[0]?.uid??null; document.body.classList.add("has-pages");
    renderThumbs(); renderMain(); markCurrent(); updateUI(); commit();
  }
  function openNupModal(){ updateNupDesc(); $("nupModal").classList.add("show"); }
  function closeNupModal(){ $("nupModal").classList.remove("show"); }
  async function nupDownload(){
    const cfg=readNup(); busy(true);
    try{ const bytes=await buildNup(cfg); saveBlob(bytes,"nup.pdf","application/pdf"); closeNupModal(); toast("已產生版面合併 PDF"); }
    catch(e){ console.error(e); toast("合併失敗："+(e.message||"未知錯誤"),true); } finally{ busy(false); }
  }
  async function nupLoad(){
    const cfg=readNup(); busy(true);
    try{ const bytes=await buildNup(cfg); await loadImposed(bytes); closeNupModal(); toast("已載入合併結果，可直接預覽或下載"); }
    catch(e){ console.error(e); toast("合併失敗："+(e.message||"未知錯誤"),true); } finally{ busy(false); }
  }

  // ---------- compress ----------
  function readCmp(){ return { dpi:parseInt($("cmpDpi").value,10), quality:parseFloat($("cmpQ").value), gray:$("cmpGray").checked, scope:$("cmpScope").value }; }
  function cmpList(cfg){ return cfg.scope==="selected"?pages.filter(p=>selected.has(p.uid)):pages.slice(); }
  function refSizeOf(list){ const used=new Set(list.map(p=>p.docId)); let s=0; used.forEach(d=>{ const doc=docs.get(d); if(doc)s+=doc.bytes.length; }); return s; }
  function toGray(canvas){ const c=document.createElement("canvas"); c.width=canvas.width; c.height=canvas.height; const x=c.getContext("2d"); x.filter="grayscale(1)"; x.drawImage(canvas,0,0); return c; }
  function updateCmpDesc(){
    const cfg=readCmp(); const list=cmpList(cfg);
    $("cmpDesc").textContent = list.length
      ? "將處理 "+list.length+" 頁（原始約 "+fmtBytes(refSizeOf(list))+"）。完成後會顯示壓縮結果大小。"
      : (cfg.scope==="selected"?"尚未勾選任何頁面。":"尚無頁面。");
  }
  async function buildCompressed(cfg, list){
    if(!list.length) throw new Error("沒有可壓縮的頁面");
    const out=await PDFDocument.create();
    for(const p of list){
      const {wpt,hpt}=await pagePointSize(p);
      let canvas=await renderStatic(p, Math.max(1,Math.round(wpt/72*cfg.dpi)));
      if(cfg.gray) canvas=toGray(canvas);
      const img=await out.embedJpg(dataURLtoBytes(canvas.toDataURL("image/jpeg", cfg.quality)));
      const page=out.addPage([wpt,hpt]);
      page.drawImage(img,{x:0,y:0,width:wpt,height:hpt});
    }
    return out.save();
  }
  function reportCmp(before, after){
    if(after<before){ const pct=before?Math.round((1-after/before)*100):0;
      toast("壓縮完成：約 "+fmtBytes(before)+" → "+fmtBytes(after)+"（縮小 "+pct+"%）"); }
    else toast("已產生：約 "+fmtBytes(before)+" → "+fmtBytes(after)+"，此檔未變小（多為文字型 PDF）；若不需要可改用一般下載。",true);
  }
  function openCmpModal(){ updateCmpDesc(); $("cmpModal").classList.add("show"); }
  function closeCmpModal(){ $("cmpModal").classList.remove("show"); }
  async function cmpDownload(){
    const cfg=readCmp(); const list=cmpList(cfg);
    if(!list.length){ toast(cfg.scope==="selected"?"請先勾選頁面":"尚無頁面",true); return; }
    busy(true);
    try{ const ref=refSizeOf(list); const bytes=await buildCompressed(cfg,list); saveBlob(bytes,"compressed.pdf","application/pdf"); closeCmpModal(); reportCmp(ref,bytes.length); }
    catch(e){ console.error(e); toast("壓縮失敗："+(e.message||"未知錯誤"),true); } finally{ busy(false); }
  }
  async function cmpLoad(){
    const cfg=readCmp(); const list=cmpList(cfg);
    if(!list.length){ toast(cfg.scope==="selected"?"請先勾選頁面":"尚無頁面",true); return; }
    busy(true);
    try{ const ref=refSizeOf(list); const bytes=await buildCompressed(cfg,list); await loadImposed(bytes,"壓縮結果"); closeCmpModal(); reportCmp(ref,bytes.length); }
    catch(e){ console.error(e); toast("壓縮失敗："+(e.message||"未知錯誤"),true); } finally{ busy(false); }
  }

  // ---------- events ----------
  let pendingInsert={mode:"end"};
  els.file.onchange=e=>{ const ins=pendingInsert; pendingInsert={mode:"end"}; loadFiles(e.target.files, ins); els.file.value=""; };
  const openMenu=$("openMenu");
  function showOpenMenu(){
    const r=els.btnOpen.getBoundingClientRect();
    openMenu.style.left=r.left+"px"; openMenu.style.top=(r.bottom+6)+"px";
    const cur=currentUid?pages.findIndex(p=>p.uid===currentUid)+1:pages.length;
    $("openAfterN").value=Math.max(1,cur); $("openAfterN").max=pages.length;
    openMenu.classList.add("show");
  }
  function hideOpenMenu(){ openMenu.classList.remove("show"); }
  function chooseInsert(mode,page){ pendingInsert={mode,page}; hideOpenMenu(); els.file.click(); }
  $("btnOpen").onclick=e=>{ e.stopPropagation();
    if(!pages.length){ pendingInsert={mode:"end"}; els.file.click(); return; }
    if(openMenu.classList.contains("show"))hideOpenMenu(); else showOpenMenu();
  };
  $("btnOpen2").onclick=()=>{ pendingInsert={mode:"end"}; els.file.click(); };
  openMenu.querySelectorAll("button[data-mode]").forEach(b=>b.addEventListener("click",()=>chooseInsert(b.dataset.mode)));
  $("openAfterGo").onclick=()=>chooseInsert("afterPage", parseInt($("openAfterN").value,10)||pages.length);
  $("openAfterN").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("openAfterGo").click(); } });

  const blankMenu=$("blankMenu");
  function showBlankMenu(){
    const r=els.btnBlank.getBoundingClientRect();
    blankMenu.style.left=r.left+"px"; blankMenu.style.top=(r.bottom+6)+"px";
    blankMenu.classList.add("show");
  }
  function hideBlankMenu(){ blankMenu.classList.remove("show"); }
  els.btnBlank.onclick=e=>{ e.stopPropagation(); if(blankMenu.classList.contains("show"))hideBlankMenu(); else showBlankMenu(); };
  blankMenu.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ hideBlankMenu(); insertBlank(b.dataset.pos); }));
  document.addEventListener("click",e=>{
    if(!blankMenu.contains(e.target)&&e.target!==els.btnBlank) hideBlankMenu();
    if(!openMenu.contains(e.target)&&e.target!==els.btnOpen) hideOpenMenu();
  });

  els.btnPnum.onclick=openPnModal;
  $("btnNup").onclick=openNupModal;
  $("nupClose").onclick=closeNupModal;
  $("nuDownload").onclick=nupDownload; $("nuLoad").onclick=nupLoad;
  $("btnCmp").onclick=openCmpModal; $("cmpClose").onclick=closeCmpModal;
  $("cmpDownload").onclick=cmpDownload; $("cmpLoad").onclick=cmpLoad;
  $("cmpModal").addEventListener("click",e=>{ if(e.target===$("cmpModal")) closeCmpModal(); });
  ["cmpDpi","cmpQ","cmpGray","cmpScope"].forEach(id=>$(id).addEventListener("change",updateCmpDesc));
  $("nupModal").addEventListener("click",e=>{ if(e.target===$("nupModal")) closeNupModal(); });
  ["nuCount","nuSheet","nuOrient","nuGap","nuMargin","nuDpi","nuScope"].forEach(id=>$(id).addEventListener("change",updateNupDesc));
  $("pnClose").onclick=closePnModal; $("pnApply").onclick=applyPn; $("pnRemove").onclick=removePn;
  els.pnModal.addEventListener("click",e=>{ if(e.target===els.pnModal) closePnModal(); });
  ["pnScope","pnStart","pnPrefix","pnSuffix","pnTotal","pnPos","pnSize","pnColor","pnSkip"].forEach(id=>{
    $(id).addEventListener("change",updatePnPreview); $(id).addEventListener("input",updatePnPreview);
  });
  els.btnDownload.onclick=downloadAll; els.btnExtract.onclick=extractSelected; els.btnPng.onclick=exportPng;
  els.btnClear.onclick=clearPages;
  els.btnRotL.onclick=()=>rotatePages(targets(),-90); els.btnRotR.onclick=()=>rotatePages(targets(),90);
  els.btnDel.onclick=()=>deletePages(targets());
  $("zIn").onclick=()=>setZoom(zoom*1.2); $("zOut").onclick=()=>setZoom(zoom/1.2); $("zFit").onclick=fitWidth;
  els.btnUndo.onclick=undo; els.btnRedo.onclick=redo; els.btnClearAnn.onclick=clearAnnPage;
  els.selAll.onclick=()=>{ if(selected.size===pages.length)selected.clear(); else pages.forEach(p=>selected.add(p.uid)); renderThumbs(); updateUI(); };

  document.querySelectorAll("#toolSet .tool").forEach(b=>b.addEventListener("click",()=>setTool(b.dataset.tool)));
  $("cpick").addEventListener("input",e=>setColor(e.target.value));
  document.querySelectorAll("#wsel .wbtn").forEach(b=>b.addEventListener("click",()=>{
    sizeKey=b.dataset.size; document.querySelectorAll("#wsel .wbtn").forEach(x=>x.classList.toggle("active",x===b)); }));

  els.overlay.addEventListener("pointerdown",onDown);
  els.overlay.addEventListener("pointermove",onMove);
  els.overlay.addEventListener("pointerup",onUp);
  els.overlay.addEventListener("pointercancel",onUp);

  document.addEventListener("keydown",e=>{
    if(/input|textarea|select/i.test(e.target.tagName))return;
    if(blankMenu.classList.contains("show")){ if(e.key==="Escape")hideBlankMenu(); }
    if(openMenu.classList.contains("show")){ if(e.key==="Escape")hideOpenMenu(); }
    if(els.pnModal.classList.contains("show")){ if(e.key==="Escape")closePnModal(); return; }
    if($("nupModal").classList.contains("show")){ if(e.key==="Escape")closeNupModal(); return; }
    if($("cmpModal").classList.contains("show")){ if(e.key==="Escape")closeCmpModal(); return; }
    if(e.key==="ArrowDown"||e.key==="ArrowRight"){e.preventDefault();stepPage(1);}
    else if(e.key==="ArrowUp"||e.key==="ArrowLeft"){e.preventDefault();stepPage(-1);}
    else if((e.key==="Delete"||e.key==="Backspace")&&currentUid&&tool==="none"){e.preventDefault();deletePages(targets());}
    else if((e.ctrlKey||e.metaKey)&&(e.key==="z"||e.key==="Z")){ e.preventDefault(); if(e.shiftKey)redo(); else undo(); }
    else if((e.ctrlKey||e.metaKey)&&e.key==="y"){ e.preventDefault(); redo(); }
    else if(e.key==="+"||e.key==="="){setZoom(zoom*1.2);}
    else if(e.key==="-"){setZoom(zoom/1.2);}
    else if(e.key==="v"){setTool("none");}
    else if(e.key==="p"){setTool("pen");}
    else if(e.key==="e"){setTool("eraser");}
  });

  let dragDepth=0;
  window.addEventListener("dragenter",e=>{ if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files")){dragDepth++;document.body.classList.add("dragfile");els.drop.classList.add("over");} });
  window.addEventListener("dragleave",()=>{ dragDepth--; if(dragDepth<=0){dragDepth=0;document.body.classList.remove("dragfile");els.drop.classList.remove("over");} });
  window.addEventListener("dragover",e=>{ if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files"))e.preventDefault(); });
  window.addEventListener("drop",e=>{ if(e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();loadFiles(e.dataTransfer.files);} dragDepth=0;document.body.classList.remove("dragfile");els.drop.classList.remove("over"); });

  buildSwatches(); setTool("none"); commit(); updateUI();
})();
</script>
</body>
</html>
